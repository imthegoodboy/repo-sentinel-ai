name: Build RepoSentinel Executa

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x86_64
          - runner: macos-15-intel
            platform: darwin-x86_64
          - runner: macos-14
            platform: darwin-arm64
          - runner: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0
      - run: pyinstaller --clean --onefile --name tool-dev-repo-sentinel-ai repo_sentinel_ai_plugin.py
      - run: python package_binary.py --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: repo-sentinel-auditor-${{ matrix.platform }}
          path: dist/repo-sentinel-auditor-1.0.1-*
          if-no-files-found: error
