[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-dev-repo-sentinel-ai"
version = "1.0.0"
description = "Read-only authorized GitHub repository auditor for RepoSentinel AI"
requires-python = ">=3.10"

[project.scripts]
"tool-dev-repo-sentinel-ai" = "repo_sentinel_ai_plugin:main"

[tool.setuptools]
py-modules = ["repo_sentinel_ai_plugin"]
